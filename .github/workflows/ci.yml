name: CI Pipeline - Merge Request to dev

on:
  pull_request:
    branches:
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  audit:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  snyk:
    runs-on: ubuntu-latest
    needs: audit
    steps:
        - name: Checkout repo
          uses: actions/checkout@v3

        - name: Run Snyk security scan
          uses: snyk/actions/node@master
          with:
            args: test
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
 
  test:
    runs-on: ubuntu-latest
    needs: snyk
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build_images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build backend Docker image
        run: docker build -t pipelinedevops-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t pipelinedevops-frontend ./frontend

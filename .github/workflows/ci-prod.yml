on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create backend .env file
        run: |
          echo "PORT=${{ secrets.BACKEND_PORT }}" > ./backend/.env
          echo "SECRET_KEY=${{ secrets.BACKEND_SECRET_KEY }}" >> ./backend/.env

      - name: Create frontend .env file
        run: |
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > ./frontend/.env

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/app:backend ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/app:backend

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/app:frontend ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/app:frontend
